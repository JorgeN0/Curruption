# Curruption theme configuration.
#
# Values are compiled into theme/modules/00-config.script by scripts/build.py.
# Run ./scripts/build.sh after every change, then reinstall.

# --- Sequence ---------------------------------------------------------------
# Wall-clock length of the sequence. The beat table in theme/modules/10-core.script
# is fixed; use animation_speed to stretch or compress the whole timeline.
animation_duration=10.0
animation_speed=1.0
# Ticks per second the script plugin is driven at. The theme asks Plymouth for
# this rate at start-up. If a Plymouth build ignores that request the sequence
# will run fast or slow; set this to the rate that build actually uses (the
# script plugin default is 50).
refresh_rate=30
# Compatibility fallback profile for stricter/older Plymouth builds.
# 0 = full feature path (requests refresh rate and sets explicit font faces).
# 1 = fallback path (skips SetRefreshRate and avoids the font argument in
#     Image.Text). Use with refresh_rate=50 unless your build uses a different
#     script tick rate.
compat_profile=0

# --- Gore skull -------------------------------------------------------------
# 1 = approved concept-06 gore skull, cut into independent head, jaw and
#     dangling-eye layers at load time.
# 0 = legacy clean skull layers (skull/head.png + skull/jaw.png). Use this on a
#     Plymouth build without image cropping support.
gore_enabled=1
# Maximum jaw travel in reference pixels, measured in the 560x560 master space.
jaw_open_distance=42
# The approved blood is baked into the master. This scales only the additional
# crack/blood tracery overlay composited on top of it. 0 disables the layer.
blood_overlay_opacity=1.0

# --- Dangling eye -----------------------------------------------------------
dangling_eye_enabled=0
# Peak swing of the pendulum in radians (~2 degrees). Deliberately small: the
# eyeball must read as heavy, never as a swinging prop.
dangling_eye_sway=0.035
# Swing rate. 1.0 is roughly a 1.6 second period.
dangling_eye_speed=0.8

# --- The watcher ------------------------------------------------------------
# The human eye that resolves out of the static at the end of the sequence,
# under the BIG BROTHER IS WATCHING caption. 0 ends on black instead.
big_brother_eye_enabled=1

# --- Red ignition -----------------------------------------------------------
# Hard on/off duration in seconds; there is no fade by design. Only the empty
# viewer-left socket ignites: the other one has its eye hanging out of it.
eye_duration=0.30
# Accent colour reference for regenerated assets. The runtime glow colour is
# baked into skull/eyes.png and skull/eye-cores.png.
eye_color_r=1.0
eye_color_g=0.0
eye_color_b=0.2

# --- Atmosphere and corruption ----------------------------------------------
# Hard-capped at 0.24 by the runtime: smoke is background only.
smoke_density=0.14
glitch_intensity=0.80
# Scanline and grain strength. 0 skips both full-screen finishing layers and
# saves roughly 16 MB of runtime memory at 1080p.
film_grain=0.12
# Surveillance lens falloff. 0 skips the full-screen vignette layer.
vignette_opacity=0.62

# --- Interface --------------------------------------------------------------
hud_enabled=1
# Every glitch, flicker and displacement derives from this seed, so the same
# value always produces the same corruption.
random_seed=31991
